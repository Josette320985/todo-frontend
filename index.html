<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#171717" media="(prefers-color-scheme: dark)" />
    <title>Mis Tareas</title>
    <style>
      html.is-reloading #root{visibility:hidden}
      #boot-skeleton{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;background:#fafafa}
      #boot-skeleton[hidden]{display:none}
      html.is-reloading #boot-skeleton{display:flex}
      .boot-nav{height:56px;background:#fff;border-bottom:1px solid #e5e5e5;display:flex;align-items:center;padding:0 1rem}
      .boot-card{box-sizing:border-box;width:min(42rem,calc(100% - 2rem));margin:2.5rem auto 0;background:#fff;border:1px solid #e5e5e5;border-radius:1rem;padding:2rem;box-shadow:0 1px 2px rgba(0,0,0,.05)}
      .boot-line,.boot-brand,.boot-row{display:block;border-radius:.375rem;background:linear-gradient(90deg,#e5e5e5 25%,#f5f5f5 50%,#e5e5e5 75%);background-size:200% 100%;animation:boot-shimmer 1.4s ease-in-out infinite}
      .boot-brand{width:7rem;height:1.25rem}
      .boot-title{width:8rem;height:1.75rem;margin-bottom:1.5rem}
      .boot-field{height:2.5rem;margin-bottom:.75rem}
      .boot-button{width:6rem;height:2.25rem;margin-bottom:1.5rem}
      .boot-row{height:1rem;margin-top:1rem}
      .boot-row.w70{width:70%}
      .boot-row.w78{width:78%}
      @keyframes boot-shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
      @media (prefers-color-scheme:dark){#boot-skeleton{background:#0a0a0a}.boot-nav{background:#171717;border-color:#262626}.boot-card{background:#171717;border-color:#262626}.boot-line,.boot-brand,.boot-row{background:linear-gradient(90deg,#262626 25%,#404040 50%,#262626 75%)}}
      @media (prefers-reduced-motion:reduce){.boot-line,.boot-brand,.boot-row{animation:none}}
    </style>
  </head>
  <body>
    <div id="boot-skeleton" role="status" aria-label="Cargando la aplicación">
      <div class="boot-nav"><span class="boot-brand"></span></div>
      <div class="boot-card">
        <span class="boot-line boot-title"></span>
        <span class="boot-line boot-field"></span>
        <span class="boot-line boot-field"></span>
        <span class="boot-line boot-button"></span>
        <span class="boot-row"></span>
        <span class="boot-row w70"></span>
        <span class="boot-row w78"></span>
      </div>
    </div>
    <!-- Root element where React mounts the application. -->
    <div id="root"></div>
    <!-- Load the React application entry point through Vite. -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
