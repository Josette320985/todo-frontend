<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#212529" />
    <title>Mis Tareas</title>
    <style>
      html.is-reloading #root{visibility:hidden}
      #boot-skeleton{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;background:#f8f9fa}
      #boot-skeleton[hidden]{display:none}
      html.is-reloading #boot-skeleton{display:flex}
      .boot-nav{height:56px;background:#212529;display:flex;align-items:center;padding:0 1rem}
      .boot-card{box-sizing:border-box;width:min(600px,calc(100% - 2rem));margin:3rem auto 0;background:#fff;border:1px solid #dee2e6;border-radius:.5rem;padding:1.25rem;box-shadow:0 .125rem .25rem rgba(0,0,0,.075)}
      .boot-line,.boot-brand,.boot-row{display:block;border-radius:.3rem;background:linear-gradient(90deg,#e9ecef 25%,#f8f9fa 50%,#e9ecef 75%);background-size:200% 100%;animation:boot-shimmer 1.4s ease-in-out infinite}
      .boot-brand{width:7rem;height:1.25rem}
      .boot-title{width:8rem;height:1.75rem;margin-bottom:1.5rem}
      .boot-field{height:2.375rem;margin-bottom:.75rem}
      .boot-button{width:6rem;height:2.375rem;margin-bottom:1.5rem}
      .boot-row{height:1rem;margin-top:1rem}
      .boot-row.w70{width:70%}
      .boot-row.w78{width:78%}
      @keyframes boot-shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
      @media (prefers-color-scheme:dark){#boot-skeleton{background:#212529}.boot-card{background:#1e2226;border-color:#495057}.boot-line,.boot-brand,.boot-row{background:linear-gradient(90deg,#343a40 25%,#495057 50%,#343a40 75%)}}
      @media (prefers-reduced-motion:reduce){.boot-line,.boot-brand,.boot-row{animation:none}}
    </style>
  </head>
  <body>
    <div id="boot-skeleton" role="status" aria-label="Cargando la aplicación">
      <div class="boot-nav"><span class="boot-brand"></span></div>
      <div class="boot-card">
        <span class="boot-line boot-title"></span>
        <span class="boot-line boot-field"></span>
        <span class="boot-line boot-field"></span>
        <span class="boot-line boot-button"></span>
        <span class="boot-row"></span>
        <span class="boot-row w70"></span>
        <span class="boot-row w78"></span>
      </div>
    </div>
    <!-- Root element where React mounts the application. -->
    <div id="root"></div>
    <!-- Load the React application entry point through Vite. -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
