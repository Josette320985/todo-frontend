# Frontend CI (TEST-10): type checking, lint, build and dependency audit.
# Runs on every pull request and on pushes to the integration branches.
name: frontend-ci

on:
  pull_request:
  push:
    branches: [main, equipo3]

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: tsc + eslint + vitest + build + audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Same Node major as the Dockerfile build stage (node:22-alpine).
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Unit and component tests with Vitest + Testing Library (TEST-07).
      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      # Production dependencies only: dev-tool advisories do not ship (SEG-H14).
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
