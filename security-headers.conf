# Defense-in-depth HTTP security headers shared by every response.
#
# Nginx does not inherit add_header directives from the enclosing level once a
# block declares any of its own, so this file is included at server level and
# again inside each location that sets its own header (index.html, /assets/).
# Keeping a single copy avoids the CSP silently drifting between blocks.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# frame-ancestors 'none' is the CSP equivalent of X-Frame-Options DENY (SEG-H15).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none';" always;
