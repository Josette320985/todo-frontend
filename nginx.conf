# Nginx configuration for the React frontend.
# Serves the production build and forwards API requests to FastAPI.
server {
    # Listen for HTTP requests on port 80.
    listen 80;

    # Hide Nginx version information in HTTP headers and error pages.
    server_tokens off;

    # Defense-in-depth HTTP security headers for every response.
    include /etc/nginx/snippets/security-headers.conf;

    # Compress text responses in Nginx instead of spending CPU in the Python
    # process. text/html is listed explicitly because setting gzip_types
    # replaces the default, which would stop compressing index.html.
    gzip on;
    gzip_types text/html application/json text/css application/javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # /api/ is proxied to FastAPI. gzip_proxied only affects requests that
    # arrive with a Via header (an upstream proxy or CDN); the default "off"
    # would silently stop compressing those responses.
    gzip_proxied any;

    # All locations below serve files from the production build.
    root /usr/share/nginx/html;

    # Serve the React application as a Single Page Application (SPA).
    location / {
        # Fall back to index.html for client-side routing.
        try_files $uri $uri/ /index.html;
    }

    # Entry point of the SPA. Always revalidated so a deployment shows up on the
    # next load instead of being served stale from the browser cache.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Vite adds a content hash to every asset filename, so a cached copy can
    # never be stale: cache them for a year and mark them immutable. A single
    # Cache-Control value avoids emitting two field lines for the same header.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Forward API requests to the FastAPI backend container.
    location /api/ {
        proxy_pass http://backend:8000/api/;

        # Reject oversized bodies before FastAPI parses them. Starlette 0.46.2
        # does not bound form fields and parsing cost grows linearly with size,
        # so nginx's 1 MB default still let a single request burn ~0.8 s of CPU.
        # Real request bodies are under 1.3 KB (title 200 + description 1000).
        client_max_body_size 16k;

        # Preserve the original request host and client information.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
