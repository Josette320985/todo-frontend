# Nginx configuration for the React frontend.
# Serves the production build and forwards API requests to FastAPI.
server {
    # Listen for HTTP requests on port 80.
    listen 80;

    # Hide Nginx version information in HTTP headers and error pages.
    server_tokens off;

    # Defense-in-depth HTTP security headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self';" always;

    # Serve the React application as a Single Page Application (SPA).
    location / {
        root /usr/share/nginx/html;

        # Fall back to index.html for client-side routing.
        try_files $uri $uri/ /index.html;
    }

    # Forward API requests to the FastAPI backend container.
    location /api/ {
        proxy_pass http://backend:8000/api/;

        # Reject oversized bodies before FastAPI parses them. Starlette 0.46.2
        # does not bound form fields and parsing cost grows linearly with size,
        # so nginx's 1 MB default still let a single request burn ~0.8 s of CPU.
        # Real request bodies are under 1.3 KB (title 200 + description 1000).
        client_max_body_size 16k;

        # Preserve the original request host and client information.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
