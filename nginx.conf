# Nginx configuration for the React frontend.
# Serves the production build and forwards API requests to FastAPI.
server {
    # Listen for HTTP requests on port 80.
    listen 80;

    # Serve the React application as a Single Page Application (SPA).
    location / {
        root /usr/share/nginx/html;

        # Fall back to index.html for client-side routing.
        try_files $uri $uri/ /index.html;
    }

    # Forward API requests to the FastAPI backend container.
    location /api/ {
        proxy_pass http://backend:8000/api/;

        # Preserve the original request host and client information.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
